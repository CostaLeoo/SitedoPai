# Ambiente de DESENVOLVIMENTO. Senhas aqui são só para uso local.
# Não testado no ambiente em que o projeto foi gerado (sem Docker); valide na sua máquina.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Na primeira inicialização, cria o banco e os papéis (owner, app, backup).
      - ./scripts/setup-db.sh:/docker-entrypoint-initdb.d/10-setup-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sitedopai
      MINIO_ROOT_PASSWORD: dev-minio-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
  miniodata:
